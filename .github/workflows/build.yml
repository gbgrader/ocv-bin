name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest glibc we support: static archives can still require newer glibc symbol versions.
          - { platform: linux-x64, runner: ubuntu-22.04, ext: tar.gz }
          - { platform: macos-arm64, runner: macos-latest, ext: tar.gz }
          - { platform: windows-x64, runner: windows-latest, ext: zip }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ "$GITHUB_REF_NAME" != "$(cat VERSION)" ]]; then
            echo "tag $GITHUB_REF_NAME doesn't match VERSION ($(cat VERSION))" >&2
            exit 1
          fi

      - uses: jdx/mise-action@v3

      - name: Build OpenCV
        run: ./build.sh out

      - name: Smoke test with gocv
        run: ./smoke.sh out

      - name: Package
        run: |
          name="ocv-bin-$(cat VERSION)-${{ matrix.platform }}.${{ matrix.ext }}"
          if [[ "${{ matrix.ext }}" == zip ]]; then
            (cd out && 7z a -tzip "../$name" . >/dev/null)
          else
            tar -czf "$name" -C out .
          fi
          echo "ARCHIVE=$name" >>"$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ocv-bin-* >SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ocv-bin-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenCV ${GITHUB_REF_NAME%-*} (build ${GITHUB_REF_NAME##*-})" \
            --notes "Static OpenCV ${GITHUB_REF_NAME%-*} for gocv. See the README for what's inside and how to link it."
